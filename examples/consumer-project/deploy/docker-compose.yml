services:
  application:
    image: ${CONTAINER_REGISTRY:?CONTAINER_REGISTRY is required}/${APPLICATION_NAME:?APPLICATION_NAME is required}:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${TARGET_ENV:?TARGET_ENV is required}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
