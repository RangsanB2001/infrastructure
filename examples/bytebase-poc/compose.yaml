name: ${COMPOSE_PROJECT_NAME:-bytebase-poc}

services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-17.6-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-homelab_app}
      POSTGRES_USER: ${POSTGRES_USER:-bytebase_poc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - bytebase-poc

  bytebase:
    image: bytebase/bytebase:${BYTEBASE_VERSION:-3.20.0}
    init: true
    restart: unless-stopped
    command:
      - --external-url
      - ${BYTEBASE_EXTERNAL_URL:-http://localhost:8080}
    ports:
      - "${BYTEBASE_BIND_ADDRESS:-127.0.0.1}:${BYTEBASE_PORT:-8080}:8080"
    volumes:
      - bytebase-data:/var/opt/bytebase
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bytebase-poc

networks:
  bytebase-poc:
    name: ${BYTEBASE_DOCKER_NETWORK:-bytebase-poc}

volumes:
  postgres-data:
  bytebase-data:
